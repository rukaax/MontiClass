name: Build and Release Firmware

on:
  push:
    branches:
      - "**"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: firmware-release
  cancel-in-progress: false

jobs:
  build-and-release:
    name: Build ESP32-S3 firmware and publish release
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Cache PlatformIO packages
        uses: actions/cache@v4
        with:
          path: ~/.platformio/.cache
          key: ${{ runner.os }}-pio-${{ hashFiles('platformio.ini') }}

      - name: Install PlatformIO Core
        run: python -m pip install --upgrade platformio

      - name: Build firmware
        run: pio run -e esp32s3

      - name: Package release files
        id: package
        shell: bash
        run: |
          set -euo pipefail

          project_name="${GITHUB_REPOSITORY#*/}"
          current_version="$(git tag --points-at "${GITHUB_SHA}" --list 'V*' --sort=-v:refname | awk '/^V[0-9]+\.[0-9]+\.[0-9]+$/ && !found { print; found=1 }')"
          latest_version="$(git tag --list 'V*' --sort=-v:refname | awk '/^V[0-9]+\.[0-9]+\.[0-9]+$/ && !found { print; found=1 }')"

          if [[ -n "${current_version}" ]]; then
            version="${current_version}"
          elif [[ -z "${latest_version}" ]]; then
            version="V1.3.1"
          elif [[ "${latest_version}" =~ ^V([0-9]+)\.([0-9]+)\.([0-9]+)$ ]]; then
            major="${BASH_REMATCH[1]}"
            minor="${BASH_REMATCH[2]}"
            patch="${BASH_REMATCH[3]}"
            version="V${major}.${minor}.$((patch + 1))"
          else
            echo "Unsupported release tag: ${latest_version}" >&2
            exit 1
          fi

          prefix="${project_name}-${version}"
          build_dir=".pio/build/esp32s3"

          mkdir -p release/bundle release/assets
          cp "${build_dir}/firmware.bin" "release/bundle/${prefix}-firmware.bin"
          cp "${build_dir}/firmware.elf" "release/bundle/${prefix}-firmware.elf"
          cp "${build_dir}/bootloader.bin" "release/bundle/${prefix}-bootloader.bin"
          cp "${build_dir}/partitions.bin" "release/bundle/${prefix}-partitions.bin"

          (
            cd release/bundle
            sha256sum ./* > SHA256SUMS.txt
          )

          cp release/bundle/* release/assets/
          tar -C release/bundle -czf "release/assets/${prefix}.tar.gz" .

          {
            echo "tag=${version}"
            echo "title=${version}"
          } >> "${GITHUB_OUTPUT}"

      - name: Write release notes
        shell: bash
        run: |
          git log -1 --pretty=%B > release-notes.md

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.package.outputs.tag }}
          RELEASE_TITLE: ${{ steps.package.outputs.title }}
        run: |
          if gh release view "${RELEASE_TAG}" --repo "${GITHUB_REPOSITORY}" >/dev/null 2>&1; then
            gh release upload "${RELEASE_TAG}" release/assets/* \
              --repo "${GITHUB_REPOSITORY}" \
              --clobber
            gh release edit "${RELEASE_TAG}" \
              --repo "${GITHUB_REPOSITORY}" \
              --title "${RELEASE_TITLE}" \
              --notes-file release-notes.md \
              --latest
          else
            gh release create "${RELEASE_TAG}" release/assets/* \
              --repo "${GITHUB_REPOSITORY}" \
              --target "${GITHUB_SHA}" \
              --title "${RELEASE_TITLE}" \
              --notes-file release-notes.md \
              --latest
          fi
