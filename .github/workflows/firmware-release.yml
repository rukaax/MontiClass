name: Build and Release Firmware

on:
  push:
    branches:
      - "**"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release:
    name: Build ESP32-S3 firmware and publish release
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Cache PlatformIO packages
        uses: actions/cache@v4
        with:
          path: ~/.platformio/.cache
          key: ${{ runner.os }}-pio-${{ hashFiles('platformio.ini') }}

      - name: Install PlatformIO Core
        run: python -m pip install --upgrade platformio

      - name: Build firmware
        run: pio run -e esp32s3

      - name: Package release files
        id: package
        shell: bash
        run: |
          set -euo pipefail

          short_sha="${GITHUB_SHA::7}"
          project_name="${GITHUB_REPOSITORY#*/}"
          version="build-${GITHUB_RUN_NUMBER}-${short_sha}"
          prefix="${project_name}-${version}"
          build_dir=".pio/build/esp32s3"

          mkdir -p release/bundle release/assets
          cp "${build_dir}/firmware.bin" "release/bundle/${prefix}-firmware.bin"
          cp "${build_dir}/firmware.elf" "release/bundle/${prefix}-firmware.elf"
          cp "${build_dir}/bootloader.bin" "release/bundle/${prefix}-bootloader.bin"
          cp "${build_dir}/partitions.bin" "release/bundle/${prefix}-partitions.bin"

          (
            cd release/bundle
            sha256sum ./* > SHA256SUMS.txt
          )

          cp release/bundle/* release/assets/
          tar -C release/bundle -czf "release/assets/${prefix}.tar.gz" .

          {
            echo "tag=firmware-${GITHUB_RUN_NUMBER}-${GITHUB_RUN_ATTEMPT}-${short_sha}"
            echo "title=Firmware ${version}"
          } >> "${GITHUB_OUTPUT}"

      - name: Write release notes
        shell: bash
        run: |
          cat > release-notes.md <<EOF
          Automated firmware build for commit ${GITHUB_SHA}.

          - Branch: ${GITHUB_REF_NAME}
          - PlatformIO environment: esp32s3
          - Workflow run: #${GITHUB_RUN_NUMBER} (attempt ${GITHUB_RUN_ATTEMPT})

          Download the compressed archive for the complete firmware bundle, or download individual files as needed. Verify downloads with SHA256SUMS.txt.
          EOF

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.package.outputs.tag }}
          RELEASE_TITLE: ${{ steps.package.outputs.title }}
        run: |
          gh release create "${RELEASE_TAG}" release/assets/* \
            --repo "${GITHUB_REPOSITORY}" \
            --target "${GITHUB_SHA}" \
            --title "${RELEASE_TITLE}" \
            --notes-file release-notes.md \
            --latest
